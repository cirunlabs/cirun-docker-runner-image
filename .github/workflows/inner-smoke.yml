name: inner-smoke

# Targets `cirun-docker-runner-image-ci`, mapped by `.cirun.yml` onto a
# docker executor running this repo's own `:latest` image. Triggered by
# every push (in parallel with `integration-test`, which is the host
# that runs cirun-agent and waits on this job).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on:
      - cirun-docker-runner-image-ci--${{ github.run_id }}
    timeout-minutes: 10
    steps:
      - name: Identity
        run: |
          set -eux
          uname -a
          cat /etc/os-release | head -3
          whoami

      - name: System stats (cpu, memory, disk)
        run: |
          set -eu
          echo "::group::CPU"
          nproc --all
          lscpu | grep -E "Model name|Architecture|CPU\(s\):|Thread|Vendor" || true
          uptime
          echo "::endgroup::"
          echo "::group::Memory"
          free -h
          echo "::endgroup::"
          echo "::group::Disk"
          df -h
          echo "::endgroup::"
          echo "::group::Block devices"
          lsblk 2>/dev/null || echo "lsblk unavailable"
          echo "::endgroup::"

      - name: Runner runtime deps installed
        run: |
          set -eu
          for lib in libicu74 libkrb5-3 zlib1g; do
            dpkg -s "$lib" >/dev/null 2>&1 && echo "  $lib OK" || { echo "::error::missing $lib"; exit 1; }
          done

      - name: CI tooling present
        run: |
          set -eux
          git --version
          curl --version | head -1
          jq --version
          gcc --version | head -1
          python3 --version

      - name: Docker access mode
        run: |
          set -eu
          if [ -S /var/run/docker.sock ]; then
            echo "docker-out-of-docker (host socket)"
            docker info >/dev/null && echo "  daemon reachable"
          elif docker info >/dev/null 2>&1; then
            echo "docker-in-docker"
            docker info | head -5
          else
            echo "runner-only (no docker)"
          fi

      - name: Pre-staged tool cache present
        run: |
          test -d /opt/hostedtoolcache || { echo "::error::/opt/hostedtoolcache missing"; exit 1; }
          echo "/opt/hostedtoolcache OK"

      - name: docker hello-world (verifies privileged DinD)
        run: |
          set -eux
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "dockerd up after ${i}s"
              break
            fi
            sleep 1
          done
          docker info | head -8
          docker run --rm hello-world
